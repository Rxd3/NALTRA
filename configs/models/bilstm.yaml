model: bilstm
enabled: true
seed: 42
device: auto
architecture:
  max_length: 256
  max_vocab: 50000
  embedding_dim: 300
  hidden_dim: 256
  layers: 1
  dropout: 0.2
training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 10
  gradient_accumulation_steps: 1
  gradient_clip: 1.0
  patience: 2
  weight_decay: 0.01
  mixed_precision: true
multilabel:
  threshold: 0.5
  per_label: {}
