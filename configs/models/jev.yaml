model: jev
enabled: true
# TypeSafe's hosted System One model (https://api.typesafe.ai). Set JEV_API_KEY and
# JEV_API_BASE_URL=https://api.typesafe.ai in .env; never commit the key.
api_key_env: JEV_API_KEY
base_url_env: JEV_API_BASE_URL
# One request carries a yes/no question for every supported label, as for Kev.
request_timeout_seconds: 120
contract:
  configured: true
  request_path: v1/systemone
  text_field: state
  scores_path: answers
  auth_header: Authorization
  auth_prefix: "Bearer "
question_template: "Is this project about {name}?"
# Empty means every direct EuroSciVoc label in taxonomy/taxonomy.json.
supported_labels: []
label_map: {}
multilabel:
  threshold: 0.5
  per_label: {}
